packages:
  - "packages/*"
  - "apps/*"
  - "examples"

# Supply-chain protection (see docs/SECURITY.md)
# Only allow package versions that are at least 7 days old (minutes).
minimumReleaseAge: 10080
# No install scripts from dependencies. Every exception must be listed here explicitly.
onlyBuiltDependencies: []
strictDepBuilds: true
