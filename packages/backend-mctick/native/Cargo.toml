[package]
name = "redstack-mctick"
version = "0.1.0"
edition = "2021"
description = "redstack test backend: runs a structure in mc-tick (Nucleation's tick engine) and reports measurements as JSON"
license = "MIT"
publish = false

[[bin]]
name = "redstack-mctick"
path = "src/main.rs"

# The engine comes from the pinned Nucleation submodule (vendor/nucleation),
# not from a registry.
[dependencies]
mc-tick = { path = "../../../vendor/nucleation/crates/mc-tick" }
mc-test = { path = "../../../vendor/nucleation/crates/mc-test" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.147"

[profile.release]
opt-level = 3
